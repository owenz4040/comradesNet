<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Immediate domain redirect for old domain -->
  <script>
    (function() {
      var hostname = window.location.hostname;
      if (hostname === 'colinowen.online' || hostname === 'www.colinowen.online') {
        var newUrl = 'https://comradeswifi.net' + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(newUrl);
      }
    })();
  </script>
  
  <title>Comrades WiFi - Fast & Reliable Internet in Kenya</title>
  
  <!-- Canonical URL - tells search engines the correct domain -->
  <link rel="canonical" href="https://comradeswifi.net/" />
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Fast, Affordable, and Reliable Internet For Students & Professionals. Stay connected with flexible plans starting at just KSh 999/month.">
  <meta name="keywords" content="comrades wifi, internet kenya, affordable internet, fast wifi, reliable internet, nairobi internet">
  <meta name="author" content="Comrades WiFi">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://comradeswifi.net/">
  <meta property="og:title" content="Comrades WiFi - Fast & Reliable Internet in Kenya">
  <meta property="og:description" content="Fast, Affordable, and Reliable Internet For Students & Professionals. Stay connected with flexible plans starting at just KSh 999/month.">
  <meta property="og:site_name" content="Comrades WiFi">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://comradeswifi.net/">
  <meta property="twitter:title" content="Comrades WiFi - Fast & Reliable Internet in Kenya">
  <meta property="twitter:description" content="Fast, Affordable, and Reliable Internet For Students & Professionals. Stay connected with flexible plans starting at just KSh 999/month.">
  
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    // Force scroll to top immediately - before anything else loads
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
  </script>
  <style>
    /* Prevent flash of scrolled content */
    html, body {
      overflow-anchor: none;
      scroll-behavior: auto !important;
    }
    #app {
      position: relative;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
